name: Publish signed SHAHID update
on:
  push:
    branches: [main]
    paths: ["numbers.txt", "websites.txt", "phrases.txt", "top.txt", "news.json", "apps.txt", "vault.json", "app/**", "scripts/**"]
  schedule:
    - cron: "17 4 * * *"   # daily 08:17 UAE time: fetch the latest scam news
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: publish, cancel-in-progress: false }
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography==43.0.3
      - name: Fetch latest scam news (never blocks publishing)
        run: python3 scripts/fetch_news.py || true
      - name: Fetch live scam websites from security feeds (never blocks publishing)
        run: python3 scripts/fetch_feeds.py || true
      - name: Build and sign pack.json
        env:
          SHAHID_SIGNING_KEY: ${{ secrets.SHAHID_SIGNING_KEY }}
        run: python3 scripts/build_pack.py
      - name: Commit signed update
        run: |
          git config user.name "shahid-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pack.json pack.json.sig; for f in news.json feeds.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || { git commit -m "Signed update $(python3 -c 'import json;print(json.load(open("pack.json"))["version"])')"; git push; }
